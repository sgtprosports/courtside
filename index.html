<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B2545">
<title>CourtSide - Pickup & Map</title>
<style>
:root{--bg:#0B2545;--surface:#13315C;--surface2:#1D4ED8;--border:#1E40AF;--text:#F2F3F5;--dim:#94A3B8;
--accent:#EF233C;--accent-dim:#D90429;--quiet:#34C77B;--mod:#F2B705;--packed:#E5484D;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%;
 font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.topbar{padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:#071E3D;}
.topbar h1{font-size:20px;font-weight:900;margin:0;letter-spacing:1px;}
.topbar p{font-size:12px;color:var(--dim);margin:2px 0 0;}
.content{flex:1;padding:14px 14px 90px;overflow-y:auto;}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;
 background:#071E3D;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;}
.tabbtn{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 8px;display:flex;
 flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;}
.tabbtn.active{color:var(--accent);}
.tabbtn svg{width:20px;height:20px;}
label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin:14px 0 6px;}
label:first-child{margin-top:0;}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);
 background:var(--surface);color:var(--text);font-size:15px;}
input:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;padding:13px;border-radius:11px;border:none;font-weight:800;font-size:15px;margin-top:14px;}
.btn-accent{background:var(--accent);color:#FFFFFF;}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text);}
.btn:disabled{opacity:.45;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
 color:var(--dim);font-weight:700;font-size:13px;}
.seg button.active{background:var(--accent);border-color:var(--accent);color:#FFFFFF;}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
 color:var(--dim);font-size:12.5px;font-weight:700;white-space:nowrap;}
.chip.active{background:var(--accent);color:#FFFFFF;border-color:var(--accent);}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5;}
.empty{text-align:center;color:var(--dim);font-size:13.5px;padding:40px 10px;line-height:1.6;}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
.ccard .top{display:flex;justify-content:space-between;align-items:flex-start;}
.ccard .nm{font-size:15.5px;font-weight:800;}
.ccard .meta{font-size:12px;color:var(--dim);margin-top:2px;}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;}
.badge.indoor{background:#1E3A8A;color:#93C5FD;}
.badge.outdoor{background:#14532D;color:#86EFAC;}
.cong{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-top:8px;display:inline-block;}
.cong.quiet{background:rgba(52,199,123,.18);color:var(--quiet);}
.cong.mod{background:rgba(242,183,5,.18);color:var(--mod);}
.cong.packed{background:rgba(229,72,77,.18);color:var(--packed);}
.cong.none{background:var(--surface2);color:var(--dim);}
.stars{display:flex;gap:2px;}
.stars svg{width:14px;height:14px;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));}
.ov-head{padding:16px;border-bottom:1px solid var(--border);position:relative;background:#071E3D;}
.ov-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:var(--surface2);
 border:none;color:var(--text);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.ov-body{padding:16px;}
.fav-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;
 color:var(--text);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
.fav-btn.on{color:var(--accent);border-color:var(--accent-dim);}
.section{margin-top:22px;}
.section h3{font-size:13px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px;}
.ratecat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--border);}
.ratecat:first-child{border-top:none;}
.ratecat .cn{font-size:13.5px;font-weight:600;}
.ratecat .avg{font-size:11px;color:var(--dim);margin-top:1px;}
.starbtn{background:none;border:none;padding:2px;color:var(--border);}
.starbtn.on{color:var(--accent);}
.cong-row{display:flex;gap:8px;}
.cong-row button{flex:1;padding:11px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
 color:var(--text);font-weight:700;font-size:12.5px;}
.cong-row button.quiet.sel{background:rgba(52,199,123,.18);border-color:var(--quiet);color:var(--quiet);}
.cong-row button.mod.sel{background:rgba(242,183,5,.18);border-color:var(--mod);color:var(--mod);}
.cong-row button.packed.sel{background:rgba(229,72,77,.18);border-color:var(--packed);color:var(--packed);}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.media-grid .m{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2);}
.media-grid .m img,.media-grid .m video{width:100%;height:100%;object-fit:cover;}
.comment{padding:10px 0;border-top:1px solid var(--border);}
.comment:first-child{border-top:none;}
.comment .who{font-size:12px;font-weight:700;color:var(--accent);}
.comment .tx{font-size:13.5px;margin-top:2px;line-height:1.4;}
textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);
 background:var(--surface);color:var(--text);font-size:14px;resize:vertical;min-height:60px;font-family:inherit;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS={
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>',
 heartFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.9 6.9-1z"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'
};
const CATS=[['floor','Floor'],['rim','Rim'],['net','Net'],['temp','Temperature'],['level','Level of Play'],
 ['lighting','Lighting'],['parking','Parking'],['vibe','Crowd Vibe']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dist(lat1,lng1,lat2,lng2){
 const R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
 const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function timeAgo(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';
 const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

let view='nearby',courts=[
 {id:'1',name:'Cameron Park',type:'outdoor',hours:'Dawn-10pm',address:'Covina, CA',lat:34.0837,lng:-117.8872},
 {id:'2',name:'Kelley Park',type:'outdoor',hours:'6am-9pm',address:'West Covina, CA',lat:34.0689,lng:-117.9389}
],myLoc=null,typeFilter='all',favIds={};
let detailId=null,detailRatings=[],myRating=null,comments=[],media=[],checkins=[];
let newCourtLoc=null;
const myId='user_local';

const root=document.getElementById('app');

function init(){
 const localFavs=localStorage.getItem('courtside_favs');
 if(localFavs) favIds=JSON.parse(localFavs);
 const localCourts=localStorage.getItem('courtside_courts');
 if(localCourts) courts=JSON.parse(localCourts);

 navigator.geolocation && navigator.geolocation.getCurrentPosition(p=>{myLoc={lat:p.coords.latitude,lng:p.coords.longitude};render();},()=>{},{timeout:8000});
 render();
}

window.setView=function(v){view=v;detailId=null;render();}
window.openDetail=function(id){detailId=id;myRating=null;detailRatings=[];comments=[];media=[];checkins=[];render();}
window.setTypeFilter=function(f){typeFilter=f;render();}
window.setAddType=function(t,el){
 document.querySelectorAll('.typeBtn').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
 window._addTypeVal=t;
}

function render(){
 let html='<div class="topbar"><div style="width:36px;height:42px;display:flex;align-items:center;justify-content:center;">' +
  '<svg viewBox="0 0 500 600" width="32" height="38"><path d="M 250 30 C 350 30 430 50 450 70 L 450 280 C 450 380 370 480 250 560 C 130 480 50 380 50 280 L 50 70 C 70 50 150 30 250 30 Z" fill="#0B2545" stroke="#FFFFFF" stroke-width="8"/><rect x="175" y="85" width="150" height="100" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4"/><ellipse cx="250" cy="205" rx="65" ry="18" fill="none" stroke="#EF233C" stroke-width="10"/><circle cx="250" cy="355" r="90" fill="#E85D04"/><line x1="160" y1="355" x2="340" y2="355" stroke="#2B0900" stroke-width="4"/></svg>' +
  '</div><div><h1>COURTSIDE</h1><p>'+
  (view==='nearby'?'Find courts near you':view==='add'?'Add a court you know':'Your saved courts')+'</p></div></div>'+
  '<div class="content">';
 if(view==='nearby') html+=renderList(courts);
 else if(view==='add') html+=renderAdd();
 else html+=renderList(courts.filter(c=>favIds[c.id]));
 html+='</div>'+renderTabbar();
 root.innerHTML=html;
 if(view==='add') wireAdd();
 if(detailId) renderDetailOverlay();
}

function renderTabbar(){
 const tabs=[['nearby','pin','Nearby'],['add','plus','Add Court'],['favorites','heart','Favorites']];
 return '<div class="tabbar">'+tabs.map(t=>'<button class="tabbtn'+(view===t[0]?' active':'')+'" onclick="setView(''+t[0]+'')">'+ICONS[t[1]]+'<span>'+t[2]+'</span></button>').join('')+'</div>';
}

function renderList(list){
 let s='<div class="chips">'+['all','indoor','outdoor'].map(f=>'<button class="chip'+(typeFilter===f?' active':'')+'" onclick="setTypeFilter(''+f+'')">'+f[0].toUpperCase()+f.slice(1)+'</button>').join('')+'</div>';
 let items=list.filter(c=>typeFilter==='all'||c.type===typeFilter);
 if(myLoc) items=items.map(c=>({...c,_d:(c.lat!=null?dist(myLoc.lat,myLoc.lng,c.lat,c.lng):null)})).sort((a,b)=>(a._d??9e9)-(b._d??9e9));
 if(!items.length) return s+'<div class="empty">'+(view==='favorites'?'No favorites yet. Tap the heart on a court to save it.':'No courts found yet. Add the first one!')+'</div>';
 return s+items.map(c=>{
  return '<div class="ccard" onclick="openDetail(''+c.id+'')"><div class="top"><div><div class="nm">'+esc(c.name)+'</div>'+
   '<div class="meta">'+(c._d!=null?c._d.toFixed(1)+' mi · ':'')+esc(c.hours||'Hours not listed')+'</div></div>'+
   '<span class="badge '+c.type+'">'+c.type+'</span></div>'+
   '<div class="row-between"><span class="cong none">Tap to view & report</span></div></div>';
 }).join('');
}

function renderAdd(){
 window._addTypeVal = window._addTypeVal || 'outdoor';
 let s='<label>Court location</label>';
 s+=newCourtLoc?('<p class="hint">Captured: '+newCourtLoc.lat.toFixed(5)+', '+newCourtLoc.lng.toFixed(5)+'</p>'):'<p class="hint">Stand at the court and capture GPS.</p>';
 s+='<button type="button" class="btn btn-outline" id="captureBtn">'+ICONS.pin+' '+(newCourtLoc?'Recapture Location':'Capture My Location')+'</button>';
 s+='<label>Court name *</label><input type="text" id="fName" placeholder="e.g. Memorial Park Courts">';
 s+='<label>Type</label><div class="seg"><button data-type="outdoor" class="typeBtn '+(window._addTypeVal==='outdoor'?'active':'')+'" onclick="setAddType('outdoor', this)">Outdoor</button><button data-type="indoor" class="typeBtn '+(window._addTypeVal==='indoor'?'active':'')+'" onclick="setAddType('indoor', this)">Indoor</button></div>';
 s+='<label>Operating hours</label><input type="text" id="fHours" placeholder="e.g. Dawn-10pm or 24/7">';
 s+='<label>Address (optional)</label><input type="text" id="fAddr" placeholder="Street, city">';
 s+='<button class="btn btn-accent" id="saveCourtBtn">Add Court</button>';
 return s;
}

function wireAdd(){
 document.getElementById('captureBtn').onclick=()=>{
  if(!navigator.geolocation) return alert('Location not available on this device.');
  navigator.geolocation.getCurrentPosition(p=>{newCourtLoc={lat:p.coords.latitude,lng:p.coords.longitude};render();},
   ()=>alert('Could not get your location. Check permissions.'),{enableHighAccuracy:true,timeout:10000});
 };
 document.getElementById('saveCourtBtn').onclick=()=>{
  const name=document.getElementById('fName').value.trim();
  if(!name) return document.getElementById('fName').focus();
  const newC={
   id:String(Date.now()),
   name,
   type:window._addTypeVal||'outdoor',
   hours:document.getElementById('fHours').value.trim(),
   address:document.getElementById('fAddr').value.trim(),
   lat:newCourtLoc?newCourtLoc.lat:null,
   lng:newCourtLoc?newCourtLoc.lng:null
  };
  courts.push(newC);
  localStorage.setItem('courtside_courts', JSON.stringify(courts));
  newCourtLoc=null; setView('nearby');
 };
}

function renderDetailOverlay(){
 document.querySelectorAll('.ov').forEach(o=>o.remove());
 const c=courts.find(x=>x.id===detailId); if(!c) return;
 const isFav=!!favIds[c.id];
 const mapsUrl = c.lat!=null ? ('https://www.google.com/maps/search/?api=1&query='+c.lat+','+c.lng) : null;
 let h='<div class="ov" id="detailOv"><div class="ov-head"><button class="ov-close" onclick="document.getElementById('detailOv').remove();detailId=null;">'+ICONS.x+'</button>'+
  '<div class="nm" style="font-size:20px;font-weight:800;">'+esc(c.name)+'</div>'+
  '<div class="meta" style="color:var(--dim);font-size:13px;margin-top:3px;">'+esc(c.hours||'Hours not listed')+(c.address?(' · '+esc(c.address)):'')+'</div>'+
  '<div style="display:flex;gap:8px;margin-top:12px;">'+
  (mapsUrl?('<a href="'+mapsUrl+'" target="_blank" class="fav-btn">'+ICONS.pin+' Directions</a>'):'')+
  '<button class="fav-btn'+(isFav?' on':'')+'" onclick="toggleFav(''+c.id+'')">'+(isFav?ICONS.heartFill:ICONS.heart)+(isFav?' Saved':' Save')+'</button>'+
  '</div></div><div class="ov-body">';

 h+='<div class="section"><h3>Right Now</h3><p class="hint">Tap a crowd level to report:</p>'+
  '<div class="cong-row">'+['quiet','mod','packed'].map(l=>'<button class="'+l+'" onclick="sendCheckin(''+c.id+'',''+l+'')">'+(l==='mod'?'Moderate':l[0].toUpperCase()+l.slice(1))+'</button>').join('')+'</div>'+
  '<div style="margin-top:10px;" id="checkinStatus"></div></div>';

 h+='</div></div>';
 root.insertAdjacentHTML('beforeend',h);
}

window.toggleFav=function(id){
 favIds={...favIds}; if(favIds[id]) delete favIds[id]; else favIds[id]=true;
 localStorage.setItem('courtside_favs', JSON.stringify(favIds));
 renderDetailOverlay();
}

window.sendCheckin=function(courtId, level){
 document.getElementById('checkinStatus').innerHTML = '<p class="hint" style="color:var(--quiet);">✓ Reported ' + level + ' crowd level!</p>';
}

init();
</script>
</body>
</html>
