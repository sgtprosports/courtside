<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Courtside 4x6 Sticker Sheet</title>
<style>
  @page {
    size: 4in 6in;
    margin: 0;
  }
  body {
    margin: 0;
    padding: 0;
    width: 4in;
    height: 6in;
    background: #FFFFFF;
    color: #000000;
    font-family: Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sheet {
    width: 4in;
    height: 6in;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    box-sizing: border-box;
    padding: 0.15in;
    gap: 0.15in;
  }
  .sticker {
    border: 1.5px dashed #000000;
    padding: 0.1in;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    box-sizing: border-box;
    background: #FFFFFF;
  }
  .app-title {
    font-size: 13pt;
    font-weight: 900;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .tagline {
    font-size: 7.5pt;
    font-weight: 700;
    margin: 2px 0;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .barcode-box {
    width: 100%;
    display: flex;
    justify-content: center;
    margin: 4px 0;
  }
  .barcode-svg {
    width: 90%;
    height: 45px;
  }
  .hashtags {
    font-size: 7pt;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin: 0;
  }
</style>
</head>
<body>

<div class="sheet">
  <!-- Sticker 1 -->
  <div class="sticker">
    <div class="app-title">COURTSIDE</div>
    <div class="tagline">Find your run & add your court</div>
    <div class="barcode-box">

        <rect x="97" y="2" width="6" height="30" fill="#000"/>
